services:
  api:
    build:
      context: .
      target: api
    environment:
      PORT: 3001
      MAX_FILE_MB: 50
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=768m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
