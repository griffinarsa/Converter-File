services:
  api:
    build:
      context: .
      target: api
    environment:
      PORT: 3001
      MAX_FILE_MB: 1024
    init: true
    read_only: true
    volumes:
      - api-tmp:/tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 4g
    cpus: 2.0
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  api-tmp:
